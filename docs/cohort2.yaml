# ---------------------------------------------------------------------------
# YAML specification for 20 future‑event prediction cohorts
# Added: rich clinical rationale explaining WHY the cohort matters
#        and WHY each inclusion/exclusion rule was chosen.
# ---------------------------------------------------------------------------
settings:
  wildcard_rule: "Use prefix match when a code ends with '*'"
  forecast_window_reference: |
    1 token ≈ 0.6 days in your training set.
    Adjust forecast_window_tokens as you refine that ratio.

cohorts:
  - id: 1
    name: "AMI → First Percutaneous Coronary Intervention"
    outcome_codes:
      procedure_cpt: ["92928", "92929"]
      procedure_icd10pcs: ["02703*", "02713*"]
    inclusion_codes:
      diagnosis_icd10: ["I25.*", "E78.*", "I20.*"]
    exclusion_codes:
      diagnosis_icd10: ["I21.*"]
      procedure_cpt: ["92928", "92929", "33533*", "33534*", "33535*", "33536*"]
    demographics: {age_min: 40, age_max: null, gender: any}
    forecast_window_tokens: 150
    notes: |
      • **Why this cohort?**  PCI is a high‑cost, high‑impact intervention and a useful benchmark for
        predicting progression from stable coronary artery disease (CAD) to an acute revascularization event.
      • **Inclusion logic**
          – CAD (*I25*), hyperlipidemia (*E78*), and angina (*I20*) capture the atherosclerotic substrate
            most likely to culminate in PCI.  
          – Age ≥ 40 isolates adults in whom CAD is clinically meaningful.
      • **Exclusion logic**
          – Prior AMI (*I21*) or PCI/CABG codes would make “first PCI” impossible to predict prospectively;
            excluding them enforces a true incident prediction task.

  - id: 2
    name: "Heart Failure Hospitalization"
    outcome_codes:
      diagnosis_icd10: ["I50.*"]
      drg: ["291", "292", "293"]
    inclusion_codes:
      diagnosis_icd10: ["I50.*"]
      drug_gpi: ["3640*"]
    exclusion_codes:
      inpatient_hf_past: true
    demographics: {age_min: 18, age_max: null, gender: any}
    forecast_window_tokens: 300
    notes: |
      • **Why this cohort?**  HF admissions drive readmissions penalties and cost; predicting
        decompensation can trigger outpatient intervention.  
      • **Inclusion logic**
          – Chronic HF diagnosis plus loop‑diuretic use tags symptomatic patients at baseline.
      • **Exclusion logic**
          – Removing anyone hospitalized for HF in the history window forces the model to
            predict a *new* admission, not repeat encounters, reducing label leakage.

  - id: 3
    name: "COPD Exacerbation Requiring ED Visit"
    outcome_codes:
      diagnosis_icd10: ["J44.1", "J44.0"]
      place_of_service: ["ED"]
    inclusion_codes:
      diagnosis_icd10: ["J44.*"]
      social_history_icd10: ["Z72.0", "F17.*"]
    exclusion_codes:
      recent_exacerbation_days: 180
    demographics: {age_min: 40, age_max: null, gender: any}
    forecast_window_tokens: 200
    notes: |
      • **Why this cohort?**  Acute COPD flares are preventable triggers for ED visits;
        early prediction could prompt inhaler optimization or pulmonary rehab.  
      • **Inclusion logic**
          – Chronic COPD diagnosis ensures baseline disease presence.  
          – Tobacco‑use codes enrich for active smokers, the highest‑risk subgroup.
      • **Exclusion logic**
          – A 180‑day washout for prior exacerbation avoids models simply “predicting the next flare
            because one just happened” (autocorrelation bias).

  - id: 4
    name: "CKD → Dialysis Initiation"
    outcome_codes:
      procedure_cpt: ["90935", "90937"]
      procedure_hcpcs: ["G0308", "G0309", "G0310", "G0311", "G0312", "G0313", "G0314"]
      diagnosis_icd10: ["Z99.2"]
    inclusion_codes:
      diagnosis_icd10: ["N18.3", "N18.4", "N18.5"]
    exclusion_codes:
      procedure_cpt: ["90935", "90937"]
      diagnosis_icd10: ["Z99.2"]
    demographics: {age_min: 18, age_max: null, gender: any}
    forecast_window_tokens: 300
    notes: |
      • **Why this cohort?**  Predicting dialysis start enables care‑coordination, fistula placement,
        and pre‑emptive transplant listing.  
      • **Inclusion logic**
          – Stage 3‑5 CKD (eGFR < 60) represents pre‑ESRD severity where dialysis is imminent.  
      • **Exclusion logic**
          – Removing existing dialysis codes prevents prevalent ESRD patients from being
            mislabeled as “future” events.

  - id: 5
    name: "Total Knee Arthroplasty"
    outcome_codes:
      procedure_cpt: ["27447"]
      procedure_icd10pcs: ["0SRD0J*"]
    inclusion_codes:
      diagnosis_icd10: ["M17.*"]
    exclusion_codes:
      status_icd10: ["Z96.651"]
    demographics: {age_min: 45, age_max: null, gender: any}
    forecast_window_tokens: 600
    notes: |
      • **Why this cohort?**  TKA is a common elective surgery; predicting which OA patients
        advance to surgery aids shared‑decision tools.  
      • **Inclusion logic**
          – Requiring knee‑OA codes focuses on those with structural disease.  
      • **Exclusion logic**
          – Prior knee‑replacement status code avoids re‑operations contaminating the outcome.

